<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F1E8">
  <title>LifeOS</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>
    // Färbt die Seite vor dem ersten Zeichnen in der ersten Verlaufsfarbe,
    // damit beim Start nichts aufblitzt. Alles Weitere macht js/ui/theme.js.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('lifeos:settings'));
        var color = saved.background.gradient.colors[0];
        if (/^#[0-9a-fA-F]{6}$/.test(color)) document.documentElement.style.backgroundColor = color;
      } catch (e) { /* ohne gespeicherte Einstellung gilt das Standardpapier */ }
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <noscript><p class="view">LifeOS braucht JavaScript.</p></noscript>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
